<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>OG image · Fireflies Consultoria</title>
<link rel="stylesheet" href="../_build/base.css">
<style>
  /* 1200×630, margem de segurança de 60 px (guia 1.2) */
  .peca { width: 1200px; height: 630px; }
  .logo { position: absolute; left: 60px; top: 60px; }
  h1 { position: absolute; left: 60px; top: 180px; width: 640px; font-size: 104px; }

  .site { position: absolute; left: 60px; bottom: 60px; font-size: 20px; }
  .barras { position: absolute; right: 60px; bottom: 100px; width: 440px; }
  .leg { position: absolute; right: 60px; bottom: 56px; width: 440px; font-size: 14px; }
</style></head>
<body>
<div class="peca noite">
  <img class="logo" src="../../logo/svg/fireflies_logo_horizontal_negativo.svg" style="width:250px" alt="Fireflies Consultoria">
  <h1 class="display">Números em <span class="lit">sincronia.</span></h1>
  <p class="sub">Consultoria financeira, contábil e fiscal em São&nbsp;Paulo. Especialistas em auditoria de condomínios.</p>
  <div class="mono site muted">fireflies.com.br</div>
  <svg class="barras" data-ff="matriz" data-values="5,8,7,10,9,12,14,16" data-max="16" data-rows="16" data-cols="3" data-gap="13" data-r="3.8" data-bargap="24" data-on="all" data-track="1"></svg>

</div>
<script src="../_build/elementos.js"></script>
