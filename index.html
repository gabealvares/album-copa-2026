<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Álbum Copa 2026 ⚽</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a9e5c; --green-light: #e8f8ef; --green-dark: #0d6b3d;
    --amber: #e8900a; --amber-light: #fff4e0;
    --red: #d63c3c; --red-light: #fdeaea;
    --bg: #f5f5f0; --card: #ffffff;
    --text: #1a1a1a; --text-muted: #777; --border: #e5e5e0;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--bg); font-family: 'Nunito', sans-serif; color: var(--text); }
  .app-header {
    background: linear-gradient(135deg, #0d6b3d 0%, #1a9e5c 60%, #22c570 100%);
    padding: 20px 16px 16px; color: white;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .header-top h1 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1px; line-height: 1; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat-pill { background: rgba(255,255,255,0.18); border-radius: 10px; padding: 8px 4px; text-align: center; }
  .stat-pill .num { font-size: 20px; font-weight: 800; line-height: 1; }
  .stat-pill .lbl { font-size: 10px; opacity: 0.85; margin-top: 2px; font-weight: 600; }
  .stat-pill.hi .num { color: #ffe066; }
  .progress-wrap { margin-top: 10px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.85; margin-bottom: 4px; font-weight: 700; }
  .progress-track { height: 7px; background: rgba(255,255,255,0.25); border-radius: 10px; overflow: hidden; }
  .progress-bar { height: 100%; background: #ffe066; border-radius: 10px; transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  .tabs-wrap { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 158px; z-index: 99; }
  .tabs { display: flex; }
  .tab-btn { flex: 1; padding: 12px 4px; font-size: 13px; font-weight: 700; background: none; border: none; cursor: pointer; color: var(--text-muted); font-family: 'Nunito', sans-serif; border-bottom: 3px solid transparent; transition: all 0.2s; }
  .tab-btn.active { color: var(--green-dark); border-bottom-color: var(--green); }
  .content { padding: 0 0 80px; }
  .search-wrap { padding: 12px 16px 8px; }
  .search-input { width: 100%; padding: 10px 14px; font-size: 14px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-family: 'Nunito', sans-serif; font-weight: 600; outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: var(--green); }
  .group-label { padding: 14px 16px 4px; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1.5px; color: var(--text-muted); }
  .team-row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; background: var(--card); border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; user-select: none; }
  .team-row:active { background: #f0f0ea; }
  .team-flag { font-size: 22px; width: 28px; text-align: center; flex-shrink: 0; }
  .team-name { flex: 1; font-size: 15px; font-weight: 700; }
  .team-meta { display: flex; align-items: center; gap: 6px; }
  .team-count { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .badge-extra { background: var(--amber-light); color: var(--amber); font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 20px; }
  .badge-done { background: var(--green-light); color: var(--green-dark); font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 20px; }
  .caret { font-size: 11px; color: var(--text-muted); }
  .sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 12px 12px; background: #fafaf6; border-bottom: 1px solid var(--border); }
  .sticker { border: 1.5px solid var(--border); border-radius: 10px; padding: 7px 5px 18px; text-align: center; cursor: pointer; position: relative; background: var(--card); transition: transform 0.1s; -webkit-user-select: none; user-select: none; min-height: 58px; }
  .sticker:active { transform: scale(0.94); }
  .sticker.owned { border-color: var(--green); background: var(--green-light); }
  .sticker.extra { border-color: var(--amber); background: var(--amber-light); }
  .sticker-code { font-size: 8px; color: var(--text-muted); margin-bottom: 2px; font-weight: 700; }
  .sticker-lbl { font-size: 10px; font-weight: 700; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sticker.owned .sticker-lbl { color: var(--green-dark); }
  .sticker.extra .sticker-lbl { color: #8a5500; }
  .sticker-qty { position: absolute; top: 3px; right: 4px; font-size: 10px; font-weight: 800; color: var(--green-dark); }
  .sticker.extra .sticker-qty { color: var(--amber); }
  .sticker-add { position: absolute; bottom: 2px; left: 4px; font-size: 14px; font-weight: 800; color: var(--green); line-height: 1; }
  .sticker-rm { position: absolute; bottom: 2px; right: 4px; font-size: 14px; font-weight: 800; color: var(--red); line-height: 1; opacity: 0.3; }
  .sticker.owned .sticker-rm, .sticker.extra .sticker-rm { opacity: 0.8; }
  .hint-bar { text-align: center; padding: 7px 16px; font-size: 11px; color: var(--text-muted); font-weight: 700; background: #f0f0ea; border-bottom: 1px solid var(--border); }
  .list-header { padding: 10px 16px 4px; font-size: 12px; color: var(--text-muted); font-weight: 700; }
  .section-title { padding: 8px 16px 4px; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; background: var(--bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .list-item { display: flex; align-items: center; gap: 8px; padding: 9px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
  .list-item-code { font-size: 10px; color: var(--text-muted); font-weight: 700; min-width: 52px; }
  .list-item-name { flex: 1; font-size: 13px; font-weight: 700; }
  .badge-qty { background: var(--amber-light); color: #8a5500; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 20px; }
  .list-item-add { font-size: 22px; color: var(--green); cursor: pointer; padding: 0 4px; font-weight: 800; line-height: 1; }
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; font-weight: 700; }
  .empty-state small { font-size: 13px; }
  .share-btn { position: fixed; bottom: 20px; right: 16px; z-index: 200; background: var(--green); color: white; border: none; border-radius: 50px; padding: 13px 20px; font-size: 14px; font-weight: 800; font-family: 'Nunito', sans-serif; box-shadow: 0 4px 16px rgba(13,107,61,0.4); cursor: pointer; display: flex; align-items: center; gap: 8px; transition: transform 0.15s; }
  .share-btn:active { transform: scale(0.96); }
  .toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 300; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app-header">
  <div class="header-top"><span>⚽</span><h1>Álbum Copa 2026</h1></div>
  <div class="stats-row">
    <div class="stat-pill hi"><div class="num" id="s-have">0</div><div class="lbl">Tenho</div></div>

  </div>
  <div class="progress-wrap">
    <div class="progress-row"><span>Progresso</span><span id="prog-lbl">0 / 980</span></div>
    <div class="progress-track"><div class="progress-bar" id="prog-bar" style="width:0%"></div></div>
  </div>
</div>
<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('album')">📋 Álbum</button>
    <button class="tab-btn" onclick="switchTab('trocas')">🔄 Trocas</button>
    <button class="tab-btn" onclick="switchTab('faltam')">🔍 Faltam</button>
  </div>
</div>
<div class="content">
  <div id="tab-album">
    <div class="hint-bar">＋ adicionar · － remover (botões em cada figurinha)</div>
    <div class="search-wrap"><input class="search-input" type="text" placeholder="🔍  Buscar seleção ou jogador..." id="search" oninput="renderAlbum()"></div>
    <div id="album-list"></div>
  </div>
  <div id="tab-trocas" style="display:none"><div id="trade-list"></div></div>
  <div id="tab-faltam" style="display:none"><div id="missing-list"></div></div>
</div>
<button class="share-btn" onclick="shareList()">📤 Compartilhar lista</button>
<div class="toast" id="toast"></div>

  {n:'ESP-OFC',l:'Abertura Oficial'},{n:'ESP-LOGO',l:'Logo Copa'},{n:'ESP-MASC',l:'Mascote'},{n:'ESP-TROF',l:'Troféu FIFA'},

  {n:'ESP-POD1',l:'Pódio 1'},{n:'ESP-POD2',l:'Pódio 2'},{n:'ESP-POD3',l:'Pódio 3'},{n:'ESP-EXT',l:'Capa Extra'}
];

const TOTAL = (() => { let t=SPECIALS.length; GROUPS.forEach(g=>g.teams.forEach(tm=>t+=tm.s.length)); return t; })();

let col = {};
let expanded = new Set();
let tab = 'album';
let pressTimer = null;

function load() { try { const d=localStorage.getItem(KEY); if(d) col=JSON.parse(d); } catch(e){} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(col)); } catch(e){} }

function allS() {
  const a=[];
  SPECIALS.forEach(s=>a.push({...s,team:'Especiais',flag:'⭐'}));
  GROUPS.forEach(g=>g.teams.forEach(tm=>tm.s.forEach(s=>a.push({...s,team:tm.name,flag:tm.flag}))));
  return a;
}

function updateStats() {
  let have=0, extras=0;
  allS().forEach(s=>{const c=col[s.n]||0;if(c>0)have++;if(c>1)extras+=(c-1);});
  const miss=TOTAL-have, pct=Math.round(have/TOTAL*100);
  document.getElementById('s-have').textContent=have;
  document.getElementById('s-miss').textContent=miss;
  document.getElementById('s-extra').textContent=extras;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('prog-lbl').textContent=have+' / '+TOTAL;
  document.getElementById('prog-bar').style.width=pct+'%';
}

function switchTab(t) {
  tab=t;
  ['album','trocas','faltam'].forEach((n,i)=>{
    document.getElementById('tab-'+n).style.display=n===t?'':'none';
    document.querySelectorAll('.tab-btn')[i].classList.toggle('active',n===t);
  });
  if(t==='trocas') renderTrades();
  if(t==='faltam') renderMissing();
}

function renderAlbum() {
  const q=(document.getElementById('search').value||'').toLowerCase();
  let html='';

  const spMatch=!q||'especiais'.includes(q)||SPECIALS.some(s=>s.l.toLowerCase().includes(q)||s.n.toLowerCase().includes(q));
  if(spMatch){
    const have=SPECIALS.filter(s=>(col[s.n]||0)>0).length;
    const exp=expanded.has('_SP');
    html+=`<div class="group-label">⭐ Especiais</div>
    <div class="team-row" onclick="toggleTeam('_SP')">
      <div class="team-flag">🏅</div><div class="team-name">Figurinhas Especiais</div>
      <div class="team-meta"><span class="team-count">${have}/${SPECIALS.length}</span>${have===SPECIALS.length?'<span class="badge-done">✓</span>':''}</div>
      <div class="caret">${exp?'▲':'▼'}</div>
    </div>`;
    if(exp){ html+=`<div class="sticker-grid">`; SPECIALS.forEach(s=>{ html+=stickerHTML(s,col[s.n]||0); }); html+=`</div>`; }
  }

  GROUPS.forEach(g=>{
    const gM=!q||g.name.toLowerCase().includes(q)||g.teams.some(tm=>tm.name.toLowerCase().includes(q)||tm.s.some(s=>s.l.toLowerCase().includes(q)||s.n.toLowerCase().includes(q)));
    if(!gM)return;
    html+=`<div class="group-label">${g.name}</div>`;
    g.teams.forEach(tm=>{
      const tM=!q||tm.name.toLowerCase().includes(q)||tm.s.some(s=>s.l.toLowerCase().includes(q)||s.n.toLowerCase().includes(q));
      if(!tM)return;
      const have=tm.s.filter(s=>(col[s.n]||0)>0).length;
      const extras=tm.s.filter(s=>(col[s.n]||0)>1).length;
      const exp=expanded.has(tm.id);
      html+=`<div class="team-row" onclick="toggleTeam('${tm.id}')">
        <div class="team-flag">${tm.flag}</div><div class="team-name">${tm.name}</div>
        <div class="team-meta"><span class="team-count">${have}/${tm.s.length}</span>${extras>0?`<span class="badge-extra">+${extras}</span>`:''}${have===tm.s.length?'<span class="badge-done">✓</span>':''}</div>
        <div class="caret">${exp?'▲':'▼'}</div>
      </div>`;
      if(exp){
        html+=`<div class="sticker-grid">`;
        tm.s.forEach(s=>{
          const sM=!q||s.l.toLowerCase().includes(q)||s.n.toLowerCase().includes(q)||tm.name.toLowerCase().includes(q);
          if(!sM)return;
          html+=stickerHTML(s,col[s.n]||0);
        });
        html+=`</div>`;
      }
    });
  });
  document.getElementById('album-list').innerHTML=html;
}

function stickerHTML(s,c){
  const cls=c>1?'extra':c===1?'owned':'';
  return `<div class="sticker ${cls}">
    <div class="sticker-code">${s.n}</div>
    <div class="sticker-lbl">${s.l}</div>
    ${c>0?`<div class="sticker-qty">${c}</div>`:''}
    <div class="sticker-add" onclick="addS('${s.n}')">＋</div>
    <div class="sticker-rm" onclick="rmS(event,'${s.n}')">－</div>
  </div>`;
}

function toggleTeam(id){ expanded.has(id)?expanded.delete(id):expanded.add(id); renderAlbum(); }

function addS(n){ col[n]=(col[n]||0)+1; save(); updateStats(); refresh(); showToast(col[n]>1?'Repetida adicionada ✓':'Figurinha adicionada ✓'); }
function rmS(e,n){ if(e&&e.stopPropagation)e.stopPropagation(); if((col[n]||0)>0){col[n]--;if(!col[n])delete col[n];} save(); updateStats(); refresh(); showToast('Figurinha removida'); }

function refresh(){
  if(tab==='album') renderAlbum();
  else if(tab==='trocas') renderTrades();
  else renderMissing();
}

function renderTrades(){
  const trades=allS().filter(s=>(col[s.n]||0)>1);
  const el=document.getElementById('trade-list');
  if(!trades.length){el.innerHTML=`<div class="empty-state"><div class="emoji">📦</div><p>Nenhuma repetida ainda</p><small>Continue abrindo pacotes!</small></div>`;return;}
  let html=`<div class="list-header">${trades.length} tipos — ${trades.reduce((a,s)=>a+(col[s.n]-1),0)} figurinhas para trocar</div>`;
  let lt='';
  trades.forEach(s=>{
    if(s.team!==lt){html+=`<div class="section-title">${s.flag} ${s.team}</div>`;lt=s.team;}
    html+=`<div class="list-item"><div class="list-item-code">${s.n}</div><div class="list-item-name">${s.l}</div><div class="badge-qty">×${col[s.n]-1}</div></div>`;
  });
  el.innerHTML=html;
}

function renderMissing(){
  const miss=allS().filter(s=>!(col[s.n]||0));
  const el=document.getElementById('missing-list');
  if(!miss.length){el.innerHTML=`<div class="empty-state"><div class="emoji">🏆</div><p>Álbum completo!</p><small>Parabéns, campeão!</small></div>`;return;}
  let html=`<div class="list-header">${miss.length} figurinhas faltando</div>`;
  let lt='';
  miss.forEach(s=>{
    if(s.team!==lt){html+=`<div class="section-title">${s.flag} ${s.team}</div>`;lt=s.team;}
    html+=`<div class="list-item"><div class="list-item-code">${s.n}</div><div class="list-item-name">${s.l}</div><div class="list-item-add" onclick="addS('${s.n}')">＋</div></div>`;
  });
  el.innerHTML=html;
}

function shareList(){
  const trades=allS().filter(s=>(col[s.n]||0)>1);
  const miss=allS().filter(s=>!(col[s.n]||0));
  const have=allS().filter(s=>(col[s.n]||0)>0).length;
  const pct=Math.round(have/TOTAL*100);
  let txt=`⚽ *Álbum Copa 2026* — ${pct}% completo (${have}/${TOTAL})\n\n`;
  if(trades.length){
    txt+=`🔄 *Tenho para trocar (${trades.reduce((a,s)=>a+(col[s.n]-1),0)} fig.):*\n`;
    trades.forEach(s=>{txt+=`• ${s.n} - ${s.l} ×${col[s.n]-1}\n`;});
    txt+='\n';
  }
  if(miss.length>0){
    txt+=`🔍 *Preciso (${miss.length} fig.):*\n`;
    miss.slice(0,30).forEach(s=>{txt+=`• ${s.n} - ${s.l}\n`;});
    if(miss.length>30)txt+=`... e mais ${miss.length-30}\n`;
  }
  if(navigator.share){navigator.share({title:'Álbum Copa 2026',text:txt}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>showToast('Lista copiada! Cole no WhatsApp ✓'));}
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

load(); updateStats(); renderAlbum();
</script>
